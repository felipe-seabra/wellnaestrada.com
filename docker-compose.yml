services:
  well-db:
    container_name: well-db
    image: supabase/postgres:15.1.0.147
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - well-db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations
    networks:
      - well-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  well-api:
    container_name: well-api
    image: postgrest/postgrest:v12.0.2
    ports:
      - "8000:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@well-db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-change-me-locally}
    depends_on:
      well-db:
        condition: service_healthy
    networks:
      - well-network

  well-adminer:
    container_name: well-adminer
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - well-network
    depends_on:
      - well-db

networks:
  well-network:
    name: well-network
    driver: bridge

volumes:
  well-db-data:
    name: well-db-data
